<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaCart</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src ="../JS/index.js"></script>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../CSS/index.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg py-3">
    <div class="container">
      <a class="navbar-brand brand" href="#">NovaCart</a>
      <div class="d-flex gap-4 ms-4">
        <a href="#" class="text-dark text-decoration-none">Shop</a>
        <a href="About.html" class="text-dark text-decoration-none">About</a></div>
      <div class="ms-auto d-flex align-items-center gap-2">
        <button class="btn btn-outline-dark"><i class="bi bi-search"></i></button>
        <select class="form-select" id="categoryFilter" onchange="filterProducts()" style="width: 150px">
            <option value="all">All Categories</option>
            <option value="electronics">Electronics</option>
            <option value="fashion">Fashion</option>
            <option value="outdoor">Outdoor</option>
            <option value="sports">Sports</option>
            <option value="beauty">Beauty</option>
          </select>

        
        <a href="login.html" class="btn btn-outline-dark">Login</a>
        <a href="register.html" class="btn btn-dark">Register</a>

        <!-- CART BUTTON -->

        <button class="btn btn-dark position-relative" data-bs-toggle="offcanvas" data-bs-target="#cartSidebar">
          <i class="bi bi-bag"></i>
          <span class="cart-badge">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- HERO -->

  <section class="hero">
    <div class="container">
      <div class="hero-content">
        <div class="hero-tag">NEW COLLECTION</div>
        <h1>Shop reliable products for everyday work and life.</h1>
        <p>Curated electronics, fashion,home goods and accessories.</p>
      </div>
    </div>
     <div class="col-lg-5">

          <div class="stats-box">

            <div class="row g-0 text-center">

              <div class="col-4">
                <div class="stat-item">
                  <div class="stat-number">50</div>
                  <div class="stat-label">Products</div>
                </div>
              </div>

              <div class="col-4">
                <div class="stat-item">
                  <div class="stat-number">5</div>
                  <div class="stat-label">Pages</div>
                </div>
              </div>

              <div class="col-4">
                <div class="stat-item">
                  <div class="stat-number">24h</div>
                  <div class="stat-label">Dispatch</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

<!-- PRODUCTS -->

<section class="py-5">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>

        <h2 class="section-title"> Products</h2>
      </div>

      <!-- SORT DROPDOWN -->
      <select class="form-select w-auto">

        <option> Featured </option>
        <option>Newest</option>
        <option> Price low-high</option>
      </select>
    </div>

    <!-- PRODUCTS -->
    <div class="row g-4" id="productContainer"></div>

    <!-- PAGINATION -->

    <nav class="mt-5 d-flex justify-content-center">
      <ul class="pagination" id="pagination"></ul>
    </nav>
  </div>
</section>

  <!-- CART SIDEBAR -->

  <div class="offcanvas offcanvas-end" tabindex="-1" id="cartSidebar">
    <div class="offcanvas-header border-bottom"><div>
        <h4 class="fw-bold mb-0">Shopping Cart</h4>
        <small class="text-muted"id="cartCount">0 items</small></div>

      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>

    <div class="offcanvas-body d-flex flex-column">

      <!-- DYNAMIC CART ITEMS -->
      <div id="cartItems"></div>

      <!-- TOTAL -->
      <div class="mt-auto border-top pt-4">
        <div class="d-flex justify-content-between mb-2">
          <span class="text-muted">Subtotal</span>
          <span class="fw-bold" id="cartSubtotal">$0.00</span></div>

        <div class="d-flex justify-content-between mb-3">
          <span class="text-muted"> Shipping</span>

          <span class="fw-bold" id="shippingCost">$0.00</span></div>

        <div class="d-flex justify-content-between fs-4 fw-bold mb-4">
          <span>Total</span>

          <span id="cartTotal">$0.00</span>
        </div>
        <button class="btn btn-outline-danger w-100 mb-3" onclick="clearCart()">Clear Cart</button>
        <button class="btn btn-dark w-100" onclick="checkout()">Checkout</button>
      </div>
    </div>
  </div>
</body>
</html>
