<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title> Login</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/login.css">
  
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg py-3">
    <div class="container">
      <a class="navbar-brand brand" href="index.html">NovaCart</a>

      <div class="d-flex align-items-center gap-4">
        <a href="index.html" class="text-dark text-decoration-none">Shop</a>
        <a href="about.html" class="text-dark text-decoration-none">About</a>
      </div>

      <div class="ms-auto d-flex gap-2">
        <button class="btn btn-outline-dark" onclick="window.location.href='login.html'">Login</button>
        <button class="btn btn-dark"onclick="window.location.href='register.html'">Register</button>
      </div>
    </div>
  </nav>

  <!-- Login Section -->
  <div class="container login-wrapper">
    <div class="row g-0 login-card">

      <!-- Left Side -->
      <div class="col-lg-6">
        <div class="left-panel">
          <div class="left-overlay"></div>
          <div class="left-content">
            <div class="welcome-text">WELCOME BACK</div>

            <h1>Access your cart and continue shopping faster.</h1>
            <p>Your demo account is stored locally in this browser
              for portfolio and learning use.</p>
          </div>
        </div>
      </div>

      <!-- Right Side -->
      <div class="col-lg-6">
        <div class="form-panel">
          <h2>Login</h2>
          <p class="subtitle">Enter your registered email and password.</p>
          <form>

            <!-- Email -->
            <div class="mb-4">
              <label class="form-label">Email address</label>

              <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email">
            </div>

            <!-- Password -->
            <div class="mb-4">
              <label class="form-label">Password</label>
              <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password">
            </div>

            <!-- Remember -->
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember" checked>
                <label class="form-check-label" for="remember">Remember me</label>
              </div>
              <a href="register.html" class="small-link">Create account</a>
            </div>

            <!-- Login Button -->
            <button type="button" class="btn btn-login w-100" onclick="loginUser()">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src ="../JS/login.js"></script>
</body>
</html>
